name: Nexroute — release (release-please)

# Versioned releases of the Nexroute-maintained solana-driver, separate from
# upstream CoW's own release.yml (weekly tags for their services).
#
# On push to main, release-please keeps a release PR open for
# crates/solana-driver from conventional commits (feat:, fix:, …) touching that
# path. Merging it tags solana-driver-vX.Y.Z, creates the GitHub release, and
# this workflow builds ghcr.io/nexroute/solana-driver:X.Y.Z (+ :latest). Deploy
# by pinning cowswap_solana_driver_version="X.Y.Z" in nexroute-infra.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + GitHub release
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs['crates/solana-driver--release_created'] }}
      version: ${{ steps.release.outputs['crates/solana-driver--version'] }}
      tag_name: ${{ steps.release.outputs['crates/solana-driver--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the release image
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: nexroute/solana-driver.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nexroute/solana-driver:${{ needs.release-please.outputs.version }}
            ghcr.io/nexroute/solana-driver:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          cache-from: type=gha,scope=solana-driver
          cache-to: type=gha,scope=solana-driver,mode=max
